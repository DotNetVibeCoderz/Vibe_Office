# OfficeNet - Dibuat oleh Gravicode Studios, dipimpin oleh Kang Fadhil.
name: OfficeNet CI

# OfficeNet lives at Vibe_Office/OfficeNet. GitHub reads workflows only from the repository root,
# so this file sits here rather than beside the project, and every path is prefixed accordingly.
#
# The path filter matters in a monorepo: without it, a commit touching an unrelated sibling would
# build and test OfficeNet for nothing.
on:
  push:
    branches: [main]
    paths:
      - "OfficeNet/**"
      - ".github/workflows/officenet-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "OfficeNet/**"
      - ".github/workflows/officenet-ci.yml"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

  # Restore and build must evaluate the same configuration. Without this, `dotnet restore` defaults
  # to Debug while the build asks for Release, so a Debug-only PackageReference is restored but
  # never built — and a missing one fails CI while every local `-c Release` build stays green.
  Configuration: Release

# Applies to every `run` step in the file; `uses` steps take explicit paths instead.
defaults:
  run:
    working-directory: OfficeNet

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # The whole point of a managed-only core is that the output is identical everywhere, so all
    # three platforms run the full suite rather than Linux running it and the others smoke-testing.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: OfficeNet/global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.os }}-${{ hashFiles('OfficeNet/**/Directory.Packages.props', 'OfficeNet/**/*.csproj') }}
          restore-keys: nuget-${{ matrix.os }}-

      - name: Restore
        run: dotnet restore OfficeNet.sln -p:Configuration=${{ env.Configuration }}

      # -warnaserror rather than a per-project setting: a warning that only appears on one platform
      # is exactly the kind this project needs to fail on.
      # The configuration is substituted by GitHub before the shell sees it, which is the one form
      # that behaves the same in bash and PowerShell. Passing it through a step-level env var did
      # not: it arrived empty on windows-latest and MSBuild reported the solution configuration
      # "|Any CPU" as invalid.
      - name: Build
        shell: bash
        run: |
          set -o pipefail

          # Raw logs need authentication to read, but ::error:: lines become annotations, and
          # annotations are public on a public repo — so a failure here is diagnosable without one.
          if ! dotnet build OfficeNet.sln -c ${{ env.Configuration }} --no-restore -warnaserror 2>&1 | tee build.log; then
            grep -E ": (error|warning) [A-Za-z]+[0-9]+" build.log | sort -u | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Test
        run: dotnet test OfficeNet.sln -c ${{ env.Configuration }} --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "OfficeNet/**/TestResults/*.trx"
          if-no-files-found: ignore

  generated:
    name: generated files are current
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: OfficeNet/global.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The notebooks and the tests lifted from them are both committed. Regenerating and diffing
      # is what stops them drifting apart — a notebook edited by hand, or a generator changed
      # without rerunning it, fails here rather than silently shipping.
      - name: Regenerate notebooks and their tests
        run: |
          python tools/gen_notebooks.py
          python tools/gen_notebook_tests.py

      - name: Fail if regenerating changed anything
        run: |
          if ! git diff --exit-code -- notebooks tests/OfficeNet.Docs.Tests/Notebooks; then
            echo "::error::Generated files are stale. Run tools/gen_notebooks.py and tools/gen_notebook_tests.py, then commit."
            exit 1
          fi

      # Screenshots are regenerated but NOT diffed: rasterised output differs by a few pixels
      # between font stacks, so a byte comparison would fail on every runner. Checking that the
      # generator still runs catches the failure that matters — an API change breaking it.
      - name: Screenshot generator still runs
        run: dotnet run --project tools/ScreenshotGen -c Release

  docs:
    name: documentation links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check relative links and images resolve
        run: python tools/check_links.py
